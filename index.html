<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daisuqe apps</title>
<meta name="description" content="daisuqe が作ったアプリの一覧">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --card: #ffffff;
    --ink: #1c1b19;
    --sub: #77736a;
    --line: #1c1b19;
    --chip: #ebe6da;
    --accent: #ff5a36;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --card: #22211e;
      --ink: #f1eee6;
      --sub: #9b968b;
      --line: #f1eee6;
      --chip: #2e2c28;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  header {
    max-width: 1120px;
    margin: 0 auto;
    padding: 48px 16px 8px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(36px, 8vw, 64px);
    letter-spacing: -0.04em;
    line-height: 0.9;
    margin: 0;
  }
  .logo span { color: var(--accent); }
  .count { color: var(--sub); font-size: 14px; margin: 0 0 4px; }

  .toolbar {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search {
    flex: 1 1 220px;
    min-width: 0;
    height: 42px;
    padding: 0 16px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    outline: none;
  }
  .search:focus { box-shadow: 3px 3px 0 var(--line); }
  .sort { display: flex; gap: 6px; flex-wrap: wrap; }
  .sort button {
    height: 42px;
    padding: 0 16px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .sort button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 16px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }

  .card {
    display: block;
    text-decoration: none;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 4px 4px 0 var(--line);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--line);
    outline: none;
  }
  .card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--line); }

  .thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border-bottom: 2px solid var(--line);
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #fff;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .mark {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 9vw, 72px);
    letter-spacing: -0.05em;
    line-height: 1;
    text-shadow: 3px 3px 0 rgba(0,0,0,.18);
  }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.22) 1.5px, transparent 1.6px);
    background-size: 14px 14px;
    pointer-events: none;
  }
  .thumb.has-img::after { display: none; }
  .new {
    position: absolute;
    top: 8px; left: 8px;
    z-index: 1;
    background: var(--accent);
    color: #fff;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 2px solid var(--line);
  }

  .meta { padding: 10px 12px 12px; }
  .name {
    font-weight: 900;
    font-size: 15px;
    margin: 0 0 4px;
    overflow-wrap: anywhere;
  }
  .desc {
    color: var(--sub);
    font-size: 12px;
    margin: 0 0 8px;
    min-height: 1.5em;
    line-height: 1.5;
  }
  .date {
    display: inline-block;
    font-family: "Space Grotesk", sans-serif;
    font-size: 11px;
    font-weight: 500;
    background: var(--chip);
    padding: 2px 8px;
    border-radius: 999px;
  }

  .empty { color: var(--sub); text-align: center; padding: 48px 0; }

  footer {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    color: var(--sub);
    font-size: 13px;
    border-top: 2px solid var(--chip);
  }
</style>
</head>
<body>

<header>
  <h1 class="logo">daisuqe<span>.</span><br>apps</h1>
  <p class="count" id="count"></p>
</header>

<div class="toolbar">
  <input class="search" id="q" type="search" placeholder="アプリを検索" aria-label="アプリを検索">
  <div class="sort" role="group" aria-label="並び順">
    <button type="button" data-sort="new" aria-pressed="true">新しい順</button>
    <button type="button" data-sort="old" aria-pressed="false">古い順</button>
    <button type="button" data-sort="name" aria-pressed="false">名前順</button>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>見つかりませんでした</p>
</main>

<footer>
  © daisuqe · <a href="https://github.com/daisuqe">GitHub</a>
</footer>

<script src="apps.js"></script>
<script>
  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  const empty = document.getElementById("empty");
  const sortButtons = document.querySelectorAll(".sort button");
  let sortMode = "new";

  const NEW_DAYS = 30;
  const now = Date.now();

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function initials(name) {
    const words = name.trim().split(/\s+/);
    if (words.length > 1) return (words[0][0] + words[1][0]).toUpperCase();
    return name.slice(0, 2).charAt(0).toUpperCase() + name.slice(1, 2).toLowerCase();
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    let list = APPS.filter(a =>
      !term || [a.name, a.slug, a.desc].join(" ").toLowerCase().includes(term));

    list.sort((a, b) => {
      if (sortMode === "name") return a.name.localeCompare(b.name, "ja", { sensitivity: "base" });
      if (sortMode === "old") return a.date.localeCompare(b.date);
      return b.date.localeCompare(a.date);
    });

    grid.innerHTML = list.map(a => {
      const isNew = (now - new Date(a.date).getTime()) / 86400000 <= NEW_DAYS;
      const thumb = a.thumb
        ? `<img src="${esc(a.thumb)}" alt="" loading="lazy">`
        : `<span class="mark">${esc(initials(a.name))}</span>`;
      return `
        <a class="card" href="/${esc(a.slug)}/">
          <div class="thumb${a.thumb ? " has-img" : ""}" style="background:${esc(a.color || "#888")}">
            ${isNew ? '<span class="new">NEW</span>' : ""}
            ${thumb}
          </div>
          <div class="meta">
            <p class="name">${esc(a.name)}</p>
            <p class="desc">${esc(a.desc)}</p>
            <span class="date">${esc(a.date.replace(/-/g, "."))}</span>
          </div>
        </a>`;
    }).join("");

    empty.hidden = list.length > 0;
    document.getElementById("count").textContent = `${APPS.length} apps`;
  }

  q.addEventListener("input", render);
  sortButtons.forEach(btn => btn.addEventListener("click", () => {
    sortMode = btn.dataset.sort;
    sortButtons.forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    render();
  }));

  render();
</script>
</body>
</html>
