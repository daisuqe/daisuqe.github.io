<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daisuqe Apps</title>
<meta name="description" content="daisuqe が作ったアプリの一覧">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --card: #ffffff;
    --ink: #48291a;
    --sub: #77736a;
    --line: #48291a;
    --chip: #ebe6da;
    --accent: #ff5a36;
    --edge: rgba(120,95,60,.07);
    --sep: rgba(0,0,0,.09);
    --title: #48291a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --card: #22211e;
      --ink: #e0c49a;
      --sub: #9b968b;
      --line: #e0c49a;
      --chip: #2e2c28;
      --edge: rgba(230,210,180,.07);
      --sep: rgba(255,255,255,.1);
      --title: #e0c49a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  header {
    max-width: 1120px;
    margin: 0 auto;
    padding: 48px 16px 8px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(36px, 8vw, 64px);
    letter-spacing: -0.04em;
    line-height: 0.9;
    margin: 0;
  }
  .logo span { color: var(--accent); }
  .count { color: var(--sub); font-size: 14px; margin: 0 0 4px; }

  .toolbar {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search {
    flex: 1 1 220px;
    min-width: 0;
    height: 42px;
    padding: 0 16px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    outline: none;
  }

  .sort { display: flex; gap: 6px; flex-wrap: wrap; }
  .sort button {
    height: 42px;
    padding: 0 16px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .sort button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 16px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }

  .card {
    display: block;
    text-decoration: none;
    transition: transform .15s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); outline: none; }
  .card:active { transform: translateY(0); }

  .thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--edge);
    border-radius: 14px;
    background-clip: padding-box;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #fff;
  }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; z-index: 1; }
  .thumb img { image-rendering: auto; image-rendering: smooth; image-rendering: high-quality; transform: translateZ(0); backface-visibility: hidden; }
  .thumb.has-img .mark { visibility: hidden; }
  .thumb.has-img { background: transparent !important; }
  .thumb .mark {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 9vw, 72px);
    letter-spacing: -0.05em;
    line-height: 1;
    text-shadow: 3px 3px 0 rgba(0,0,0,.18);
  }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.22) 1.5px, transparent 1.6px);
    background-size: 14px 14px;
    pointer-events: none;
  }
  .thumb.has-img::after { display: none; }
  .new {
    position: absolute;
    top: 8px; left: 8px;
    z-index: 2;
    background: var(--accent);
    color: #fff;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 2px solid var(--line);
  }

  .new.label { background: #f5769e; color: #fff; }

  .meta { padding: 8px 2px 0; display: flex; flex-direction: column; gap: 4px; }
  .meta > * { margin: 0; line-height: 1.3; }
  .desc:empty { display: none; }
  .name {
    color: var(--title);
    font-weight: 900;
    font-size: 18px;
    overflow-wrap: anywhere;
  }
  .desc {
    color: var(--sub);
    font-size: 13px;
  }
  .date {
    font-family: "Space Grotesk", sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--sub);
    opacity: .6;
  }

  .sep {
    border: 0;
    border-top: 1px solid var(--sep);
    margin: 34px 0 17px;
  }
  .section-title {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 5vw, 36px);
    letter-spacing: -0.03em;
    margin: 0 0 12px;
  }

  .empty { color: var(--sub); text-align: center; padding: 48px 0; }

  footer {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    color: var(--sub);
    font-size: 13px;
    border-top: 2px solid var(--chip);
  }
</style>
</head>
<body>

<header>
  <h1 class="logo">daisuqe Apps</h1>
  <p class="count" id="count"></p>
</header>

<div class="toolbar">
  <input class="search" id="q" type="search" placeholder="Search" aria-label="Search">
  <div class="sort" role="group" aria-label="並び順">
    <button type="button" data-sort="new" aria-pressed="true">▼ NEW</button>
    <button type="button" data-sort="old" aria-pressed="false">▼ OLD</button>
    <button type="button" data-sort="name" aria-pressed="false">▼ NAME</button>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>見つかりませんでした</p>

  <hr class="sep">
  <h2 class="section-title">nodegram Apps</h2>
  <div class="grid" id="ngrid"></div>
</main>

<footer>
  © daisuqe · <a href="https://x.com/daiii">X</a> · <a href="https://d00harada.blogspot.com/">Blog</a> · <a href="https://www.youtube.com/@daisuqee">YouTube</a>
</footer>

<script src="apps.js?v=20261004c"></script>
<script>
  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  const empty = document.getElementById("empty");
  const sortButtons = document.querySelectorAll(".sort button");
  let sortMode = "new";

  const NEW_DAYS = 30;
  const now = Date.now();

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function initials(name) {
    const words = name.trim().split(/\s+/);
    if (words.length > 1) return (words[0][0] + words[1][0]).toUpperCase();
    return name.slice(0, 2).charAt(0).toUpperCase() + name.slice(1, 2).toLowerCase();
  }

  // thumbs/<slug>.png → .jpg → .webp の順に探し、無ければ頭文字タイルのまま
  const THUMB_EXTS = ["png", "jpg", "webp"];
  function thumbLoaded(img) {
    img.parentElement.classList.add("has-img");
  }
  function thumbFailed(img) {
    const i = THUMB_EXTS.findIndex(ext => img.src.endsWith(`/${img.dataset.slug}.${ext}`));
    if (i >= 0 && i < THUMB_EXTS.length - 1) img.src = `thumbs/${img.dataset.slug}.${THUMB_EXTS[i + 1]}`;
    else img.remove();
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    let list = APPS.filter(a =>
      !term || [a.name, a.slug, a.desc].join(" ").toLowerCase().includes(term));

    list.sort((a, b) => {
      if (!!a.pin !== !!b.pin) return a.pin ? -1 : 1;
      if (sortMode === "name") return a.name.localeCompare(b.name, "ja", { sensitivity: "base" });
      if (sortMode === "old") return a.date.localeCompare(b.date);
      return b.date.localeCompare(a.date);
    });

    grid.innerHTML = list.map(a => {
      const isNew = (now - new Date(a.date).getTime()) / 86400000 <= NEW_DAYS;
      const src = a.thumb || `thumbs/${a.slug}.png`;
      const thumb = `<span class="mark">${esc(initials(a.name))}</span>`
        + `<img src="${esc(src)}" alt="" loading="lazy" data-slug="${esc(a.slug)}" onload="thumbLoaded(this)" onerror="thumbFailed(this)">`;
      return `
        <a class="card" href="/${esc(a.slug)}/">
          <div class="thumb" style="background:${esc(a.color || "#888")}">
            ${a.label ? `<span class="new label">${esc(a.label)}</span>` : isNew ? '<span class="new">NEW</span>' : ""}
            ${thumb}
          </div>
          <div class="meta">
            <p class="name">${esc(a.name)}</p>
            <p class="desc">${esc(a.desc)}</p>
            <span class="date">${esc(a.date.replace(/-/g, "."))}</span>
          </div>
        </a>`;
    }).join("");

    empty.hidden = list.length > 0;
    document.getElementById("count").textContent = `${APPS.length} + ${(window.NODEGRAM_APPS || []).length} apps`;
  }

  // nodegram apps (検索・並び替えの対象外、説明・日付なし)
  document.getElementById("ngrid").innerHTML = (window.NODEGRAM_APPS || []).map(a => `
    <a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">
      <div class="thumb has-img" style="background:#111">
        <img src="${esc(a.thumb)}" alt="" loading="lazy">
      </div>
      <div class="meta"><p class="name">${esc(a.name)}</p><p class="desc">${esc(a.desc)}</p></div>
    </a>`).join("");

  q.addEventListener("input", render);
  sortButtons.forEach(btn => btn.addEventListener("click", () => {
    sortMode = btn.dataset.sort;
    sortButtons.forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    render();
  }));

  render();
</script>
</body>
</html>
